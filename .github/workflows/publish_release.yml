name: Publish Windows Release

on:
  workflow_run:
    workflows:
      - "Build Windows"
    branches: [main]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Check out the exact build commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Read version and release notes
        id: release
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          if [[ "$head_sha" != "$HEAD_SHA" ]]; then
            echo "::error::Checked out $head_sha, expected $HEAD_SHA"
            exit 1
          fi

          raw_version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1)"
          version="${raw_version%%+*}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid app version: $raw_version"
            exit 1
          fi

          tag="$version"
          archive="Venera-Windows-v$version.zip"
          notes="release_notes/$tag.md"
          if [[ ! -f "$notes" ]]; then
            echo "::error::Missing release notes: $notes"
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"

      - name: Download Windows build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.release.outputs.archive }}
          run-id: ${{ github.event.workflow_run.id }}
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify artifact and release target
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          ARCHIVE: ${{ steps.release.outputs.archive }}
        run: |
          set -euo pipefail
          artifact="dist/$ARCHIVE"
          if [[ ! -f "$artifact" ]]; then
            echo "::error::Expected artifact is missing: $artifact"
            exit 1
          fi
          unzip -tq "$artifact"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to replace it"
            exit 1
          fi
          existing_tag="$(git ls-remote --tags origin "refs/tags/$TAG")"
          if [[ -n "$existing_tag" ]]; then
            echo "::error::Tag $TAG already exists; refusing to reuse it"
            exit 1
          fi

      - name: Create a new Windows release
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          ARCHIVE: ${{ steps.release.outputs.archive }}
          NOTES: ${{ steps.release.outputs.notes }}
        run: |
          set -euo pipefail
          gh release create "$TAG" "dist/$ARCHIVE" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Venera $TAG" \
            --notes-file "$NOTES" \
            --target "$HEAD_SHA"

          tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
          tag_type="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type')"
          if [[ "$tag_type" == "tag" ]]; then
            tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq '.object.sha')"
          fi
          if [[ "$tag_object" != "$HEAD_SHA" ]]; then
            echo "::error::Release tag points to $tag_object instead of $HEAD_SHA"
            exit 1
          fi

          release_assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          if ! grep -Fxq "$ARCHIVE" <<< "$release_assets"; then
            echo "::error::Release asset $ARCHIVE is missing"
            exit 1
          fi

          echo "Release $TAG points to $HEAD_SHA and includes $ARCHIVE"
