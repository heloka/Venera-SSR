name: Build Windows
on:
  push:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true
          
      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter tests
        run: flutter test
        
      - name: Enable Windows support
        run: flutter config --enable-windows-desktop
        
      - name: Build Windows
        run: flutter build windows --release

      - name: Bundle Real-CUGAN Vulkan runtime
        shell: pwsh
        run: ./scripts/prepare_windows_upscale.ps1 -Destination build/windows/x64/runner/Release/upscale
        
      - name: Package Windows Build
        shell: pwsh
        run: |
          $VERSION = (Get-Content pubspec.yaml | Select-String "version: ").ToString().Split(" ")[1].Split("+")[0]
          $ARCHIVE_NAME = "Venera-Windows-v$VERSION.zip"
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath $ARCHIVE_NAME
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> $env:GITHUB_ENV

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: "*.zip"
